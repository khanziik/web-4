
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
         <a href="index.html">Back to tasks</a>
          <h1 class="mt-3">Task 3: Bootstrap Validation</h1>

        <form id="contactForm" novalidate>
            <div class="mb-3">
                <label for="contactName" class="form-label">Name</label>
                <input type="text" id="contactName" name="name"
                          class="form-control" required minlength="2">

                <div class="invalid-feedback">Please enter your name</div>
                <div class="valid-feedback">correct</div>
            </div>

            <div class="mb-3">
                <label for="contactEmail" class="form-label">Email</label>
                <input type="email" id="contactEmail" name="email"
                       class="form-control" required>
                 <div class="invalid-feedback">Please enter a valid email.</div>
                <div class="valid-feedback">correct</div>
            </div>

            <div class="mb-3">
               <label for="contactMessage" class="form-label">Message</label>
                <textarea id="contactMessage" name="message"
                           class="form-control" rows="4"
                          required minlength="5"></textarea>
                <div class="invalid-feedback">Message must contain at least 5 characters</div>
                <div class="valid-feedback">correct</div>

            </div>


            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>

            <p id="contactResult" class="mt-3" aria-live="polite"></p>
        </form>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
